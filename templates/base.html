<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventCheck - Gestion Événements{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EventCheck">
    <meta name="theme-color" content="#667eea">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="{{ url_for('main.index') }}" class="logo">🎉 EventCheck</a>
            <div class="nav-actions">
                <a href="{{ url_for('main.create_event') }}" class="nav-link">➕ Nouveau</a>
                <a href="{{ url_for('main.index') }}" class="nav-link">📋 Événements</a>
                <a href="{{ url_for('logout') }}" class="nav-link logout">🚪 Quitter</a>
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
